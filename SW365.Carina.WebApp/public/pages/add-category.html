<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Category - Personal Finance</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="app-shell">
    <div id="appNavigation"></div>
    <script src="/js/navigation.js"></script>

    <!-- Main Content -->
    <main id="mainContent" tabindex="-1" class="container py-4" style="max-width: 600px">
      <div class="mb-4">
        <a href="/pages/categories.html" class="btn btn-outline-secondary">
          <i class="bi bi-chevron-left me-1"></i>Back to Categories
        </a>
      </div>

      <div class="card">
        <div class="card-header bg-success text-white">
          <h4 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i>Add New Category</h4>
        </div>
        <div class="card-body">
          <form id="addCategoryForm" novalidate>
            <div class="mb-3">
              <label for="addName" class="form-label"
                >Category Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="addName"
                name="name"
                placeholder="e.g., Groceries"
                required
              />
              <div class="invalid-feedback">Please enter a category name.</div>
            </div>

            <div class="mb-4">
              <label for="addType" class="form-label"
                >Category Type <span class="text-danger">*</span></label
              >
              <select class="form-select" id="addType" name="categoryType" required>
                <option value="">-- Select Type --</option>
                <option value="INCOME">Income</option>
                <option value="EXPENSE">Expense</option>
                <option value="ASSET">Asset</option>
              </select>
              <div class="invalid-feedback">Please select a category type.</div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a href="/pages/categories.html" class="btn btn-secondary">
                <i class="bi bi-x-circle me-1"></i>Cancel
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle me-1"></i>Create Category
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/add-category.js"></script>
  </body>
</html>
