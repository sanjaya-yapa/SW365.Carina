<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgets - Personal Finance</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="app-shell">
    <div id="appNavigation"></div>
    <script src="/js/navigation.js"></script>

    <!-- Main Content -->
    <main id="mainContent" tabindex="-1" class="container-fluid py-4">
      <div
        class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">Monthly Budget Plan</h1>
          <p class="text-muted mb-0">Enter planned values by category for the selected month.</p>
        </div>

        <form class="row gy-2 gx-2 align-items-end" id="budgetFilterForm">
          <div class="col-6 col-md-auto">
            <label for="budgetYear" class="form-label mb-1">Year</label>
            <input
              type="number"
              class="form-control"
              id="budgetYear"
              min="2000"
              max="2100"
              required
            />
          </div>
          <div class="col-6 col-md-auto">
            <label for="budgetMonth" class="form-label mb-1">Month</label>
            <select class="form-select" id="budgetMonth" required>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>
          <div class="col-12 col-md-auto">
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-search me-1"></i>Load
            </button>
          </div>
        </form>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="text-muted" id="budgetSummary">Loading budget grid...</div>
        <button type="button" class="btn btn-success" id="saveBudgetBtn">
          <i class="bi bi-save me-1"></i>Save All
        </button>
      </div>

      <div class="table-responsive border rounded">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Plan ID</th>
              <th scope="col">Category</th>
              <th scope="col">Type</th>
              <th scope="col" style="min-width: 180px">Planned Amount</th>
              <th scope="col" style="min-width: 260px">Note</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="budgetGridBody"></tbody>
        </table>
      </div>
      <p class="text-muted text-center mt-4 mb-0 d-none" id="emptyMessage"></p>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/budgets.js"></script>
  </body>
</html>
