<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Account - Personal Finance</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="app-shell">
    <div id="appNavigation"></div>
    <script src="/js/navigation.js"></script>

    <!-- Main Content -->
    <main id="mainContent" tabindex="-1" class="container py-4" style="max-width: 600px">
      <div class="mb-4">
        <a href="/pages/accounts.html" class="btn btn-outline-secondary">
          <i class="bi bi-chevron-left me-1"></i>Back to Accounts
        </a>
      </div>

      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Account</h4>
        </div>
        <div class="card-body">
          <form id="editAccountForm" novalidate>
            <input type="hidden" id="editId" />

            <div class="mb-3">
              <label for="editName" class="form-label"
                >Account Name <span class="text-danger">*</span></label
              >
              <input type="text" class="form-control" id="editName" name="name" required />
              <div class="invalid-feedback">Please enter an account name.</div>
            </div>

            <div class="mb-3">
              <label for="editType" class="form-label"
                >Account Type <span class="text-danger">*</span></label
              >
              <select class="form-select" id="editType" name="accountType" required>
                <option value="">-- Select Type --</option>
                <option value="CASH">Cash</option>
                <option value="SAVINGS">Savings</option>
                <option value="CREDIT_CARD">Credit Card</option>
                <option value="DEBIT_CARD">Debit Card</option>
                <option value="DIRECT_DEBIT">Direct Debit</option>
              </select>
              <div class="invalid-feedback">Please select an account type.</div>
            </div>

            <div class="mb-4">
              <label for="editBalance" class="form-label">Opening Balance</label>
              <input
                type="number"
                class="form-control"
                id="editBalance"
                name="openingBalance"
                step="0.01"
                min="0"
              />
              <small class="form-text text-muted">Starting balance for this account</small>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-between">
              <button type="button" class="btn btn-outline-danger" id="deleteAccountBtn">
                <i class="bi bi-trash me-1"></i>Delete
              </button>
              <div class="d-grid gap-2 d-md-flex">
                <a href="/pages/accounts.html" class="btn btn-secondary">
                  <i class="bi bi-x-circle me-1"></i>Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-check-circle me-1"></i>Update Account
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-labelledby="deleteConfirmLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="deleteConfirmLabel">
              <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0">
              <strong>Are you sure you want to delete this account?</strong><br />
              This will deactivate the account so it no longer appears in active account lists.
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/edit-account.js"></script>
  </body>
</html>
