<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts - Personal Finance</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="app-shell">
    <div id="appNavigation"></div>
    <script src="/js/navigation.js"></script>

    <!-- Main Content -->
    <main id="mainContent" tabindex="-1" class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Accounts</h1>
        <a href="/pages/add-account.html" class="btn btn-success">
          <i class="bi bi-plus-circle me-1"></i>Add Account
        </a>
      </div>

      <div class="btn-group mb-4" role="group" aria-label="Account view selector">
        <button type="button" class="btn btn-primary" id="activeAccountsBtn">
          <i class="bi bi-check-circle me-1"></i>Active
        </button>
        <button type="button" class="btn btn-outline-primary" id="deletedAccountsBtn">
          <i class="bi bi-archive me-1"></i>Deleted
        </button>
      </div>

      <!-- Accounts Grid -->
      <div class="row g-4" id="accountsGrid"></div>
      <p class="text-muted text-center mt-5 mb-0" id="emptyMessage">Loading accounts...</p>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/accounts.js"></script>
  </body>
</html>
