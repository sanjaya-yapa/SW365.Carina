<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts - Personal Finance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/"><i class="bi bi-wallet2 me-2"></i>Personal Finance</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/dashboard.html"><i class="bi bi-bar-chart me-1"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="/pages/accounts.html"><i class="bi bi-credit-card me-1"></i>Accounts</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/categories.html"><i class="bi bi-tags me-1"></i>Categories</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/budgets.html"><i class="bi bi-calculator me-1"></i>Budgets</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/transactions.html"><i class="bi bi-arrow-left-right me-1"></i>Transactions</a></li>
            <li class="nav-item"><a class="nav-link" href="/pages/reports.html"><i class="bi bi-file-earmark-text me-1"></i>Reports</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Accounts</h1>
        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAccountModal">
          <i class="bi bi-plus-circle me-1"></i>Add Account
        </button>
      </div>

      <!-- Accounts Grid -->
      <div class="row g-4" id="accountsGrid"></div>
      <p class="text-muted text-center mt-5 mb-0" id="emptyMessage">Loading accounts...</p>
    </div>

    <!-- Add Account Modal -->
    <div class="modal fade" id="addAccountModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addAccountLabel">Add Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="addAccountForm">
              <div class="mb-3">
                <label for="addName" class="form-label">Account Name *</label>
                <input type="text" class="form-control" id="addName" name="name" required />
              </div>
              <div class="mb-3">
                <label for="addType" class="form-label">Account Type *</label>
                <select class="form-select" id="addType" name="accountType" required>
                  <option value="">-- Select Type --</option>
                  <option value="CASH">Cash</option>
                  <option value="BANK">Bank</option>
                  <option value="CARD">Card</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="addBalance" class="form-label">Opening Balance</label>
                <input type="number" class="form-control" id="addBalance" name="openingBalance" step="0.01" min="0" value="0" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="addAccountBtn">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Account Modal -->
    <div class="modal fade" id="editAccountModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editAccountLabel">Edit Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editAccountForm">
              <input type="hidden" id="editId" />
              <div class="mb-3">
                <label for="editName" class="form-label">Account Name *</label>
                <input type="text" class="form-control" id="editName" name="name" required />
              </div>
              <div class="mb-3">
                <label for="editType" class="form-label">Account Type *</label>
                <select class="form-select" id="editType" name="accountType" required>
                  <option value="">-- Select Type --</option>
                  <option value="CASH">Cash</option>
                  <option value="BANK">Bank</option>
                  <option value="CARD">Card</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editBalance" class="form-label">Opening Balance</label>
                <input type="number" class="form-control" id="editBalance" name="openingBalance" step="0.01" min="0" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="deleteAccountBtn" style="margin-right: auto;">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="editAccountBtn">Update</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/accounts.js"></script>
  </body>
</html>
